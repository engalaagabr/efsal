<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Penguin stretching its back" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Palette: charcoal #23272e, warm off-white #f5eddf, muted teal #5fa8a3 -->

  <!-- Feet (planted, unrotated) -->
  <ellipse cx="222" cy="438" rx="36" ry="15" fill="#5fa8a3" transform="rotate(-4 222 438)"/>
  <ellipse cx="296" cy="438" rx="36" ry="15" fill="#5fa8a3" transform="rotate(4 296 438)"/>

  <!-- Body leans back, pivoting from the feet -->
  <g transform="rotate(-10 256 420)">
    <!-- Flippers tucked behind lower back -->
    <path d="M156 205 C98 222 86 292 150 326" fill="none" stroke="#23272e" stroke-width="44" stroke-linecap="round"/>

    <!-- Body: belly pushed forward, back gently arched -->
    <path d="M256 62 C338 62 388 130 386 228 C384 330 340 432 256 432 C190 432 146 380 144 300 C143 262 136 242 142 214 C150 120 186 62 256 62 Z" fill="#23272e"/>

    <!-- Belly -->
    <path d="M276 158 C340 158 372 226 366 298 C360 372 322 414 270 414 C228 414 206 356 206 288 C206 214 232 158 276 158 Z" fill="#f5eddf"/>

    <!-- Relieved, sleepy closed eyes -->
    <path d="M232 118 Q246 132 260 118" fill="none" stroke="#f5eddf" stroke-width="9" stroke-linecap="round"/>
    <path d="M296 118 Q310 132 324 118" fill="none" stroke="#f5eddf" stroke-width="9" stroke-linecap="round"/>

    <!-- Beak -->
    <path d="M270 142 Q294 134 318 146 Q300 166 274 158 Q264 152 270 142 Z" fill="#5fa8a3"/>

    <!-- Cheek -->
    <circle cx="340" cy="150" r="11" fill="#5fa8a3"/>
  </g>
</svg>
